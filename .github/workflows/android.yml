
      - name: Extract Android project ZIP
        run: |
          echo "Checking repository files..."
          pwd
          ls -lah
          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "SmartMitraAI-GitHub-Ready.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*GitHub-Ready*.zip" -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
